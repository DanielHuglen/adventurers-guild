<span class="date">
	{{ currentDate | date: "shortDate" }}
	@if ((role | async) === "admin") {
		<button (click)="openAdjustDate()">Change</button>
		<dialog #dialog closedby="any">
			<app-adjust-date-form [currentDate]="currentDate" (adjustedDate)="handleAdjustedDate($event)" />
		</dialog>
	}
</span>
<a [routerLink]="['']">
	<img src="img/logo.jpeg" alt="Eventyrerlauget logo" />
	<div>
		<h1>Eventyrerlauget</h1>
	</div>
</a>
<div class="actions">
	<button
		type="button"
		class="theme-toggle"
		(click)="themeService.toggle()"
		aria-label="Toggle theme"
		title="Toggle theme">
		{{ themeService.theme() === "dark" ? "☀️" : "🌙" }}
	</button>
	<button (click)="openPasswordPrompt()">
		{{ (role | async)?.toUpperCase() }}
		👤
	</button>
</div>
